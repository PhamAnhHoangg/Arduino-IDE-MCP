<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14a3a8"/><stop offset="1" stop-color="#0b5f73"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3440"/><stop offset="1" stop-color="#151b22"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <!-- pins -->
  <g fill="#e6edf3">
    <g id="pins">
      <rect x="178" y="96" width="22" height="56" rx="6"/>
      <rect x="230" y="96" width="22" height="56" rx="6"/>
      <rect x="282" y="96" width="22" height="56" rx="6"/>
      <rect x="334" y="96" width="22" height="56" rx="6" opacity="0"/>
    </g>
    <use href="#pins" transform="translate(0 264)"/>
    <use href="#pins" transform="rotate(90 256 256)"/>
    <use href="#pins" transform="rotate(90 256 256) translate(0 264)"/>
  </g>
  <!-- chip body -->
  <rect x="140" y="140" width="232" height="232" rx="36" fill="url(#chip)"/>
  <rect x="140" y="140" width="232" height="232" rx="36" fill="none" stroke="#000" stroke-opacity=".25" stroke-width="4"/>
  <circle cx="176" cy="176" r="10" fill="#3d4754"/>
  <!-- sparkle (AI assist) -->
  <path d="M256 186 C264 236 276 248 326 256 C276 264 264 276 256 326 C248 276 236 264 186 256 C236 248 248 236 256 186 Z" fill="#ffd23f"/>
  <!-- code brackets -->
