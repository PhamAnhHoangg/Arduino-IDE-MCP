name: Release

# Push a tag like v0.9.4 to publish a GitHub Release with arduino.plugin attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest && python -m pytest -q
      - run: python scripts/build_plugin.py
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/arduino.plugin
          generate_release_notes: true
