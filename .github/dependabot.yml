version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    ignore:
      # mcp 2.x changes the server API; the tests fail on it. Move to it by hand.
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]
